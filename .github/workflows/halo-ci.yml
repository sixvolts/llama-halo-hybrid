name: halo-ci

# Checks for llama-halo-hybrid on GitHub-hosted runners: the CPU build with warnings as errors plus its tests, the
# server tests of this tree's behaviour, compile-only HIP (also with CUDA graphs off; the other RDNA targets weekly),
# CUDA and Vulkan builds, and a lint of this tree's own Python. Nothing here needs a GPU; the GPU suites are tests/halo.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'halo-cookbook/**', 'docs/**', 'tests/halo/**']
  pull_request:
    paths-ignore: ['**/*.md', 'halo-cookbook/**', 'docs/**', 'tests/halo/**']
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly: everything, plus the HIP targets no push builds (hip-other)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Build (warnings as errors)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_RPC=ON -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_FATAL_WARNINGS=ON -DGGML_NATIVE=OFF
          cmake --build build -j 4
      - name: Tests
        run: ctest --test-dir build -L main --output-on-failure -j 4

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev python3-venv
          python3 -m venv venv && venv/bin/pip install -r tools/server/tests/requirements.txt
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target llama-server
      - name: Server tests (this tree's behaviour, speculative decoding)
        run: |
          cd tools/server/tests && mkdir -p tmp
          LLAMA_SERVER_BIN_PATH=../../../build/bin/llama-server ../../../venv/bin/python -m pytest -q \
            unit/test_halo.py unit/test_speculative.py

  hip:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: rocm/dev-ubuntu-24.04:7.2.1-complete
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: apt-get update && apt-get install -y ninja-build cmake git libssl-dev
      - name: Build (gfx1151, gfx1201)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_HIP=ON "-DGPU_TARGETS=gfx1151;gfx1201" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang -DGGML_RPC=ON -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target ggml-hip llama-server ggml-rpc-server
      - name: Build with CUDA graphs off (gfx1151)
        run: |
          cmake -S . -B build-nographs -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_HIP=ON -DGPU_TARGETS=gfx1151 \
            -DGGML_HIP_GRAPHS=OFF -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang -DGGML_NATIVE=OFF
          cmake --build build-nographs -j 4 --target ggml-hip

  hip-other:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: rocm/dev-ubuntu-24.04:7.2.1-complete
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: apt-get update && apt-get install -y ninja-build cmake git libssl-dev
      - name: Build (gfx1100, gfx1101, gfx1030)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_HIP=ON "-DGPU_TARGETS=gfx1100;gfx1101;gfx1030" \
            -DCMAKE_HIP_COMPILER=/opt/rocm/lib/llvm/bin/clang -DGGML_RPC=ON -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target ggml-hip llama-server

  cuda:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: apt-get update && apt-get install -y ninja-build cmake git libssl-dev
      - name: Build (compile only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=89;120a" \
            -DGGML_RPC=ON -DGGML_NATIVE=OFF -DCMAKE_EXE_LINKER_FLAGS=-Wl,--allow-shlib-undefined
          cmake --build build -j 4 --target ggml-cuda llama-server

  vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev libvulkan-dev glslc spirv-headers
      - name: Build (compile only)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_NATIVE=OFF
          cmake --build build -j 4 --target ggml-vulkan llama-server

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Dependencies
        run: python3 -m venv venv && venv/bin/pip install flake8 pytest numpy pyyaml
      - name: flake8 (this tree's own Python)
        run: venv/bin/flake8 tests/halo scripts/halo-hybrid conversion/glm5next.py conversion/qwen4exp.py
      - name: gguf-py tests
        run: cd gguf-py && PYTHONPATH=. ../venv/bin/python -m pytest -q tests
